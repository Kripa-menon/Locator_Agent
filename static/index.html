<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locator Finder Agent</title>
    <style>
      :root {
        --bg: #edf3fb;
        --bg-strong: #dfeaf8;
        --panel: rgba(255, 255, 255, 0.82);
        --panel-strong: #ffffff;
        --card: #ffffff;
        --border: rgba(143, 169, 201, 0.35);
        --shadow: 0 18px 42px rgba(17, 41, 75, 0.08);
        --blue: #1f7ae0;
        --blue-strong: #0d5ec7;
        --blue-soft: rgba(31, 122, 224, 0.12);
        --text: #142338;
        --muted: #5f728b;
        --green: #14b26a;
        --amber: #f3a33b;
        --danger: #dc5d4b;
        --dark: #0f172a;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(79, 136, 255, 0.09), transparent 34%),
          linear-gradient(135deg, #edf3fb 0%, #f8fbff 45%, #eef4ff 100%);
        color: var(--text);
      }

      body {
        padding: 22px;
      }

      .app-shell {
        max-width: 1460px;
        margin: 0 auto;
        background: rgba(255,255,255,0.32);
        border: 1px solid rgba(255,255,255,0.45);
        backdrop-filter: blur(8px);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 28px 17px;
        background: rgba(255,255,255,0.65);
        border-bottom: 1px solid var(--border);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: linear-gradient(135deg, #3b82f6, #1f7ae0 55%, #8dc6ff);
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 18px;
        box-shadow: inset 0 2px 7px rgba(255,255,255,0.35), 0 8px 18px rgba(31,122,224,0.3);
      }

      .brand h1 {
        margin: 0;
        font-size: clamp(1.1rem, 1rem + 0.8vw, 1.95rem);
        letter-spacing: -0.04em;
      }

      .header-status {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(126, 156, 199, 0.4);
        border-radius: 999px;
        background: rgba(255,255,255,0.7);
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 5px rgba(20, 178, 106, 0.1);
      }

      .layout {
        display: grid;
        grid-template-columns: 480px minmax(0, 1fr);
        gap: 18px;
        padding: 18px 18px 22px;
      }

      .panel {
        background: rgba(255,255,255,0.52);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: 0 10px 22px rgba(15, 23, 42, 0.04);
      }

      .left-panel {
        padding: 18px;
      }

      .section {
        background: rgba(255, 255, 255, 0.62);
        border: 1px solid rgba(154, 179, 214, 0.38);
        border-radius: 18px;
        padding: 16px 16px 14px;
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
      }

      .section + .section {
        margin-top: 16px;
      }

      .section-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .section-title {
        font-size: 0.98rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .field-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .field-row.compact {
        gap: 8px;
      }

      .field-wrap {
        position: relative;
        flex: 1;
      }

      .label {
        display: block;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        color: var(--muted);
        margin-bottom: 8px;
        font-weight: 700;
      }

      input[type="text"],
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid rgba(134, 164, 201, 0.55);
        background: rgba(255,255,255,0.85);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.98rem;
        color: var(--text);
        transition: all 0.2s ease;
        outline: none;
      }

      select {
        appearance: auto;
        -webkit-appearance: menulist;
        color: var(--text);
        background: #fff;
      }

      select option {
        background: #fff;
        color: var(--text);
        padding: 8px;
      }

      input:focus, select:focus {
        border-color: rgba(31,122,224,0.7);
        box-shadow: 0 0 0 4px rgba(31,122,224,0.08);
      }

      button {
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
      }

      .primary-btn {
        background: linear-gradient(135deg, #1f7ae0, #0f68d1);
        color: white;
        box-shadow: 0 12px 18px rgba(31,122,224,0.22);
      }

      .secondary-btn {
        background: rgba(255,255,255,0.82);
        border: 1px solid rgba(134, 164, 201, 0.6);
        color: var(--text);
      }

      .ghost-btn {
        background: rgba(31,122,224,0.08);
        color: var(--blue-strong);
      }

      .tiny-btn {
        padding: 9px 12px;
        font-size: 0.82rem;
      }

      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .session-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .session-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .right-panel {
        padding: 18px 18px 16px;
      }

      .results-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .results-head h2 {
        margin: 0;
        font-size: clamp(1.3rem, 1.1rem + 0.8vw, 2rem);
        letter-spacing: -0.04em;
      }

      .results-summary {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 999px;
        background: rgba(31,122,224,0.08);
        color: var(--blue-strong);
        font-size: 0.75rem;
        font-weight: 700;
      }

      .results-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        min-height: 460px;
      }

      .result-item {
        background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(246,250,255,0.94));
        border: 1px solid rgba(136, 164, 201, 0.42);
        border-radius: 20px;
        padding: 18px 18px 14px;
        box-shadow: 0 12px 22px rgba(19, 41, 69, 0.04);
      }

      .selector-card {
        padding-top: 14px;
      }

      .result-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }

      .result-top .title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .match-badge {
        display: inline-flex;
        align-items: center;
        padding: 7px 12px;
        border-radius: 9px;
        font-size: 0.92rem;
        font-weight: 700;
        background: rgba(31,122,224,0.12);
        color: var(--blue-strong);
        border: 1px solid rgba(31,122,224,0.18);
      }

      .match-badge.success {
        background: rgba(20,178,106,0.1);
        color: var(--green);
        border-color: rgba(20,178,106,0.2);
      }

      .selector-label {
        font-size: 0.95rem;
        color: var(--muted);
        font-weight: 700;
      }

      .selector-value {
        display: block;
        margin: 14px 0 12px;
        font-size: clamp(1.5rem, 1.3rem + 1vw, 3rem);
        font-weight: 800;
        letter-spacing: -0.05em;
        word-break: break-word;
        line-height: 1.15;
        color: var(--text);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        margin: 0 0 14px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .meta .pill {
        display: inline-flex;
        align-items: center;
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid rgba(31,122,224,0.12);
        background: rgba(31,122,224,0.05);
        font-weight: 600;
      }

      .meta .pill.success {
        background: rgba(20,178,106,0.1);
        border-color: rgba(20,178,106,0.2);
        color: var(--green);
      }

      .meta .pill.warning {
        background: rgba(243,163,59,0.12);
        border-color: rgba(243,163,59,0.25);
        color: #b77810;
      }

      .meta .pill.danger {
        background: rgba(220,93,75,0.12);
        border-color: rgba(220,93,75,0.22);
        color: var(--danger);
      }

      .meta .pill.muted {
        background: rgba(17,24,39,0.04);
        border-color: rgba(17,24,39,0.08);
        color: var(--text);
      }

      .small {
        color: var(--muted);
        font-size: 0.8rem;
        line-height: 1.5;
      }

      .result-warning {
        display: none;
      }

      .alternative-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px solid rgba(136, 164, 201, 0.3);
        color: var(--text);
        font-weight: 700;
      }

      .alternative-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-top: 12px;
      }

      .alternative-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid rgba(136, 164, 201, 0.28);
        border-radius: 12px;
        background: rgba(255,255,255,0.5);
      }

      .alternative-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        font-size: 0.95rem;
      }

      .alternative-type {
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
        min-width: 72px;
      }

      .alternative-value {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }

      .alternative-meta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .alternative-meta .ok {
        color: var(--green);
        font-weight: 700;
      }

      .alternative-meta .status-high {
        color: var(--green);
        font-weight: 700;
      }

      .alternative-meta .status-medium {
        color: #b77810;
        font-weight: 700;
      }

      .alternative-meta .status-low {
        color: var(--danger);
        font-weight: 700;
      }

      .risk-row {
        margin-top: 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .code-panel {
        margin-top: 14px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(136, 164, 201, 0.4);
      }

      .code-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        background: rgba(17, 24, 39, 0.97);
        color: #ebf4ff;
        padding: 10px 12px;
      }

      .code-toolbar select {
        width: auto;
        min-width: 120px;
        background: rgba(255,255,255,0.05);
        color: #edf8ff;
        border: 1px solid rgba(164,187,225,0.28);
      }

      .copy-btn {
        background: rgba(255,255,255,0.08);
        color: white;
        padding: 8px 12px;
        border: 1px solid rgba(164,187,225,0.2);
      }

      pre {
        margin: 0;
        padding: 15px 16px;
        background: #0f172a;
        color: #dbebff;
        font-size: 0.84rem;
        line-height: 1.6;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .muted-box {
        padding: 18px;
        border-radius: 16px;
        background: rgba(255,255,255,0.55);
        border: 1px dashed rgba(143, 169, 201, 0.5);
        color: var(--muted);
      }

      .loader {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(31,122,224,0.08);
        color: var(--blue-strong);
        font-weight: 700;
        font-size: 0.82rem;
      }

      .loader::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 2px solid rgba(31,122,224,0.25);
        border-top-color: var(--blue-strong);
        animation: spin 0.8s linear infinite;
        display: inline-block;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @media (max-width: 1080px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        body { padding: 12px; }
        header {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
          padding: 16px 18px;
        }
        .field-row, .session-row, .session-actions {
          grid-template-columns: 1fr;
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <div class="brand">
          <div class="brand-mark">◎</div>
          <h1>Locator Finder Agent</h1>
        </div>
        <div class="header-status">
          <div class="status-pill"><span class="dot"></span> Local only • live DOM via Playwright</div>
        </div>
      </header>

      <main class="layout">
        <aside class="panel left-panel">
          <div class="section">
            <div class="section-header">
              <div class="section-title">Page URL</div>
            </div>
            <div class="stack">
              <div class="field-row compact">
                <div class="field-wrap">
                  <input id="url" type="text" value="" placeholder="https://example.com" />
                </div>
              </div>
              <div class="field-row compact">
                <button id="open" class="primary-btn" style="flex:1">Open</button>
                <button id="continue" class="secondary-btn" style="flex:1">Continue</button>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Description</div>
            </div>
            <div class="stack">
              <div class="field-row compact">
                <div class="field-wrap">
                  <input id="desc" type="text" value="" placeholder="e.g. username field" />
                </div>
                <button id="describe" class="primary-btn tiny-btn">Describe</button>
              </div>
              <div class="field-row compact">
                <div class="field-wrap">
                  <input id="picksel" type="text" value="" placeholder="e.g. input#username" />
                </div>
                <button id="pick" class="secondary-btn tiny-btn">Pick</button>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-header">
              <div class="section-title">Sessions</div>
            </div>
            <div class="stack">
              <div class="session-row">
                <select id="sessionSelect">
                  <option value="default">default</option>
                </select>
                <button id="refreshSessions" class="secondary-btn tiny-btn">Refresh</button>
              </div>
              <div class="field-row compact">
                <div class="field-wrap">
                  <input id="newSessionName" type="text" value="" placeholder="session name" />
                </div>
                <button id="createSession" class="primary-btn tiny-btn">Create</button>
              </div>
              <div class="session-actions">
                <button id="activateSession" class="primary-btn tiny-btn">Activate</button>
                <button id="closeSession" class="secondary-btn tiny-btn">Close</button>
              </div>
            </div>
          </div>
        </aside>

        <section class="panel right-panel">
          <div class="results-head">
            <h2>Results</h2>
            <div id="resultsSummary" class="results-summary"><span>0 locators</span><span>•</span><span>found</span></div>
          </div>
          <div id="results" class="results-list"></div>
        </section>
      </main>
    </div>

    <script>
      function getLocatorStability(matchCount){
        const count = Number(matchCount ?? 0);
        if (count <= 1) return { label: 'High stability', short: 'High', className: 'success' };
        if (count <= 3) return { label: 'Medium stability', short: 'Medium', className: 'warning' };
        return { label: 'Low stability', short: 'Low', className: 'danger' };
      }

      function updateResultsSummary(count){
        const summary = document.getElementById('resultsSummary');
        if (!summary) return;
        const n = Number(count || 0);
        summary.innerHTML = `<span>${n} locator${n === 1 ? '' : 's'}</span><span>•</span><span>${n === 0 ? 'none found' : 'found'}</span>`;
      }

      function setLoadingState(button, isLoading, label){
        if (!button) return;
        const original = button.dataset.originalLabel || button.textContent;
        button.dataset.originalLabel = original;
        button.disabled = isLoading;
        button.style.opacity = isLoading ? '0.7' : '1';
        button.style.cursor = isLoading ? 'wait' : 'pointer';
        button.textContent = isLoading ? (label || 'Loading...') : original;
      }

      function clearFormValues(){
        const ids = ['url', 'desc', 'picksel', 'newSessionName'];
        ids.forEach((id) => {
          const el = document.getElementById(id);
          if (el) {
            el.value = '';
            el.setAttribute('autocomplete', 'off');
          }
        });
      }

      async function post(path, body){
        const r = await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        let data;
        try { data = await r.json(); } catch (e) { data = { detail: await r.text() }; }
        if(!r.ok){
          const detail = data && data.detail ? data.detail : `Request failed with status ${r.status}`;
          throw new Error(detail);
        }
        return data;
      }
      async function get(path){ const r = await fetch(path); return r.json(); }

      function makeCodeBlock(snippets){
        const container = document.createElement('div');
        const langs = Object.keys(snippets || {});
        if (langs.length === 0) return document.createElement('div');

        const select = document.createElement('select');
        langs.forEach((l) => {
          const o = document.createElement('option');
          o.value = l;
          o.textContent = l;
          o.selected = (l === 'python');
          select.appendChild(o);
        });

        const pre = document.createElement('pre');
        pre.textContent = snippets['python'] || snippets[langs[0]];

        const btn = document.createElement('button');
        btn.textContent = 'Copy';
        btn.className = 'copy-btn';
        btn.onclick = () => navigator.clipboard.writeText(pre.textContent);

        select.onchange = () => { pre.textContent = snippets[select.value]; };

        const toolbar = document.createElement('div');
        toolbar.className = 'code-toolbar';
        toolbar.appendChild(select);
        toolbar.appendChild(btn);

        const codeWrap = document.createElement('div');
        codeWrap.className = 'code-panel';
        codeWrap.appendChild(toolbar);
        codeWrap.appendChild(pre);
        container.appendChild(codeWrap);
        return container;
      }

      async function fetchSessions(){
        const data = await get('/sessions');
        const sel = document.getElementById('sessionSelect');
        sel.innerHTML = '';
        const optDefault = document.createElement('option');
        optDefault.value = 'default';
        optDefault.textContent = 'default';
        sel.appendChild(optDefault);
        (data || []).forEach((s) => {
          const o = document.createElement('option');
          o.value = s.id;
          o.textContent = s.name || s.id;
          sel.appendChild(o);
        });
      }

      document.getElementById('refreshSessions').onclick = fetchSessions;

      document.getElementById('createSession').onclick = async () => {
        const name = document.getElementById('newSessionName').value;
        if (!name || !name.trim()) {
          alert('Enter a session name');
          return;
        }
        const res = await post('/sessions', { name });
        await fetchSessions();
        document.getElementById('newSessionName').value = '';
        alert('Created ' + res.id);
      };

      document.getElementById('activateSession').onclick = async () => {
        const sid = document.getElementById('sessionSelect').value;
        if (!sid) {
          alert('Select a session');
          return;
        }
        await post('/sessions/' + sid + '/activate', {});
        alert('Activated ' + sid);
      };

      document.getElementById('closeSession').onclick = async () => {
        const sid = document.getElementById('sessionSelect').value;
        if (!sid || sid === 'default') {
          alert('Select a non-default session to close');
          return;
        }
        await post('/sessions/' + sid + '/close', {});
        await fetchSessions();
        alert('Closed ' + sid);
      };

      document.getElementById('open').onclick = async () => {
        const url = document.getElementById('url').value;
        const session = document.getElementById('sessionSelect').value;
        const out = document.getElementById('results');
        out.innerHTML = '';
        try {
          const res = await post('/open', { url, session });
          alert(JSON.stringify(res));
        } catch (err) {
          out.innerHTML = '<div class="muted-box">Open failed: ' + (err && err.message ? err.message : 'unknown error') + '</div>';
          alert('Open failed: ' + (err && err.message ? err.message : 'unknown error'));
        }
      };

      document.getElementById('continue').onclick = async () => {
        await post('/continue', {});
        alert('Ready');
      };

      document.getElementById('describe').onclick = async () => {
        const description = document.getElementById('desc').value;
        const session = document.getElementById('sessionSelect').value;
        const out = document.getElementById('results');
        const button = document.getElementById('describe');
        out.innerHTML = '';
        if (!description || !description.trim()) {
          out.innerHTML = '<div class="muted-box">Enter a description to search for an element.</div>';
          updateResultsSummary(0);
          return;
        }
        setLoadingState(button, true, 'Searching...');
        const loader = document.createElement('div');
        loader.className = 'loader';
        loader.textContent = 'Searching for locator';
        out.appendChild(loader);
        try {
          const res = await post('/describe', { description, session });
          out.innerHTML = '';
          if (!res.matches || res.matches.length === 0) {
            out.innerHTML = '<div class="muted-box">No matches. Try a more specific description.</div>';
            updateResultsSummary(0);
            return;
          }

          const seen = new Set();
          const uniqueMatches = res.matches.filter((m) => {
            const key = JSON.stringify({
              best: m.ranked && (m.ranked.chosen_best || m.ranked.best),
              alternatives: m.ranked && m.ranked.alternatives
            });
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          });

          uniqueMatches.forEach((m) => {
            const box = document.createElement('div');
            box.className = 'result-item selector-card';

            const best = m.ranked.chosen_best || m.ranked.best;
            const matchCount = Number(best && best.match_count !== null && best.match_count !== undefined ? best.match_count : 0);

            const top = document.createElement('div');
            top.className = 'result-top';
            const titleWrap = document.createElement('div');
            titleWrap.className = 'title-wrap';

            const badge = document.createElement('span');
            badge.className = 'match-badge success';
            badge.textContent = best && best.match_count === 1 ? 'Best match' : 'Match';

            const typeLabel = document.createElement('div');
            typeLabel.className = 'selector-label';
            typeLabel.textContent = best && best.type ? (best.type === 'css' ? 'CSS selector' : `${best.type.toUpperCase()} selector`) : 'Selector';

            titleWrap.appendChild(badge);
            titleWrap.appendChild(typeLabel);
            top.appendChild(titleWrap);

            const copyBtn = document.createElement('button');
            copyBtn.className = 'secondary-btn tiny-btn';
            copyBtn.textContent = 'Copy';
            copyBtn.onclick = () => navigator.clipboard.writeText(best ? best.value : '');
            top.appendChild(copyBtn);
            box.appendChild(top);

            const selectorValue = document.createElement('div');
            selectorValue.className = 'selector-value';
            selectorValue.textContent = best ? best.value : 'No locator';
            box.appendChild(selectorValue);

            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.innerHTML = [
              '<span class="pill success">✓ ' + (matchCount === 1 ? '1 match' : matchCount + ' matches') + '</span>',
              '<span class="pill muted">High stability</span>',
              '<span class="pill muted">Found by ' + ((best && best.reason ? best.reason : 'selector').toLowerCase().replace(/.*?id.*/, 'id').replace(/.*?name.*/, 'name').replace(/.*?placeholder.*/, 'placeholder').replace(/.*?data-.*?/, 'attribute')) + '</span>'
            ].join('');
            box.appendChild(meta);

            const alternatives = [...(m.ranked.alternatives || [])].filter(Boolean);
            const altHeader = document.createElement('div');
            altHeader.className = 'alternative-header';
            const altToggle = document.createElement('button');
            altToggle.type = 'button';
            altToggle.className = 'secondary-btn tiny-btn';
            altToggle.style.border = 'none';
            altToggle.style.background = 'transparent';
            altToggle.style.padding = '0';
            altToggle.style.fontWeight = '700';
            altToggle.textContent = alternatives.length ? (alternatives.length + ' hidden') : '0 hidden';
            altHeader.innerHTML = '<span>Alternatives</span>';
            altHeader.appendChild(altToggle);
            box.appendChild(altHeader);

            const altList = document.createElement('div');
            altList.className = 'alternative-list';
            altList.style.display = 'none';
            const renderAlternatives = () => {
              altList.innerHTML = '';
              alternatives.forEach((a) => {
                const item = document.createElement('div');
                item.className = 'alternative-item';
                const left = document.createElement('div');
                left.className = 'alternative-left';
                const type = document.createElement('span');
                type.className = 'alternative-type';
                type.textContent = a.type === 'xpath' ? 'XPath' : 'CSS';
                const value = document.createElement('span');
                value.className = 'alternative-value';
                value.textContent = a.value || 'n/a';
                left.appendChild(type);
                left.appendChild(value);
                const metaRight = document.createElement('div');
                metaRight.className = 'alternative-meta';
                const aCount = Number(a.match_count ?? 0);
                const stability = getLocatorStability(aCount);
                metaRight.innerHTML = '<span class="ok">' + (aCount === 1 ? '1 match' : aCount + ' matches') + '</span><span>•</span><span class="status-' + stability.short.toLowerCase() + '">' + stability.short + '</span>';
                item.appendChild(left);
                item.appendChild(metaRight);
                altList.appendChild(item);
              });
            };
            altToggle.onclick = () => {
              const shown = altList.style.display !== 'none';
              altList.style.display = shown ? 'none' : 'flex';
              altToggle.textContent = shown ? (alternatives.length ? (alternatives.length + ' hidden') : '0 hidden') : 'Hide alternatives';
              if (!shown) renderAlternatives();
            };
            box.appendChild(altList);

            const risk = document.createElement('div');
            risk.className = 'risk-row';
            const risks = [];
            if (best && best.reason && best.reason.toLowerCase().includes('auto')) risks.push('ID looks auto-generated');
            if (best && matchCount !== 1) risks.push('Matches != 1');
            if (best && best.cross_origin_frame) risks.push('Inside cross-origin iframe');
            if (best && best.found_shadow) risks.push('Inside shadow DOM');
            risk.textContent = 'Risks: ' + (risks.length ? risks.join('; ') : 'None');
            box.appendChild(risk);

            const actions = document.createElement('div');
            actions.className = 'actions';
            const hl = document.createElement('button');
            hl.textContent = 'Highlight';
            hl.className = 'primary-btn tiny-btn';
            hl.onclick = async () => {
              const currentBest = m.ranked.chosen_best || m.ranked.best;
              if (!currentBest) return alert('No locator');
              const s = document.getElementById('sessionSelect').value;
              const result = await post('/highlight', { type: currentBest.type, value: currentBest.value, session: s });
              hl.textContent = 'Highlighted ' + result.highlighted;
              setTimeout(() => hl.textContent = 'Highlight', 1800);
            };

            const uhl = document.createElement('button');
            uhl.textContent = 'Unhighlight';
            uhl.className = 'secondary-btn tiny-btn';
            uhl.onclick = async () => {
              const s = document.getElementById('sessionSelect').value;
              const result = await post('/unhighlight', { session: s });
              uhl.textContent = 'Removed ' + result.unhighlighted;
              setTimeout(() => uhl.textContent = 'Unhighlight', 1800);
            };

            actions.appendChild(hl);
            actions.appendChild(uhl);
            box.appendChild(actions);

            const codeblock = makeCodeBlock(m.code);
            box.appendChild(codeblock);

            out.appendChild(box);
          });
          updateResultsSummary(uniqueMatches.length);
        } catch (err) {
          out.innerHTML = '<div class="muted-box">Describe failed: ' + (err && err.message ? err.message : 'unknown error') + '</div>';
          updateResultsSummary(0);
          alert('Describe failed: ' + (err && err.message ? err.message : 'unknown error'));
        } finally {
          setLoadingState(button, false, 'Describe');
        }
      };

      function renderLocatorResult(data) {
        const out = document.getElementById('results');
        out.innerHTML = '';

        const ranked = data && data.ranked ? data.ranked : { best: null, alternatives: [] };
        const best = ranked.chosen_best || ranked.best;
        const card = document.createElement('div');
        card.className = 'result-item selector-card';

        const top = document.createElement('div');
        top.className = 'result-top';
        const titleWrap = document.createElement('div');
        titleWrap.className = 'title-wrap';

        const badge = document.createElement('span');
        badge.className = 'match-badge success';
        badge.textContent = best && Number(best.match_count) === 1 ? 'Best match' : 'Match';

        const label = document.createElement('div');
        label.className = 'selector-label';
        label.textContent = best && best.type ? (best.type === 'css' ? 'CSS selector' : `${best.type.toUpperCase()} selector`) : 'Selector';

        titleWrap.appendChild(badge);
        titleWrap.appendChild(label);
        top.appendChild(titleWrap);

        const copyBtn = document.createElement('button');
        copyBtn.className = 'secondary-btn tiny-btn';
        copyBtn.textContent = 'Copy';
        copyBtn.onclick = () => navigator.clipboard.writeText(best ? best.value : '');
        top.appendChild(copyBtn);
        card.appendChild(top);

        const selectorValue = document.createElement('div');
        selectorValue.className = 'selector-value';
        selectorValue.textContent = best ? best.value : 'No locator found';
        card.appendChild(selectorValue);

        const meta = document.createElement('div');
        meta.className = 'meta';
        const matchCount = Number(best && best.match_count !== null && best.match_count !== undefined ? best.match_count : 0);
        const stability = getLocatorStability(matchCount);
        meta.innerHTML = [
          '<span class="pill success">✓ ' + (matchCount === 1 ? '1 match' : matchCount + ' matches') + '</span>',
          '<span class="pill ' + stability.className + '">' + stability.label + '</span>',
          '<span class="pill muted">Found by ' + ((best && best.reason ? best.reason : 'selector').toLowerCase().replace(/.*?id.*/, 'id').replace(/.*?name.*/, 'name').replace(/.*?placeholder.*/, 'placeholder').replace(/.*?data-.*?/, 'attribute')) + '</span>'
        ].join('');
        card.appendChild(meta);

        const risks = document.createElement('div');
        risks.className = 'risk-row';
        const issues = [];
        if (best && best.reason && String(best.reason).toLowerCase().includes('auto')) issues.push('ID looks auto-generated');
        if (best && matchCount !== 1) issues.push('Matches != 1');
        if (best && best.cross_origin_frame) issues.push('Inside cross-origin iframe');
        if (best && best.found_shadow) issues.push('Inside shadow DOM');
        risks.textContent = 'Risks: ' + (issues.length ? issues.join('; ') : 'None');
        card.appendChild(risks);

        const alt = document.createElement('div');
        alt.className = 'small';
        alt.style.marginTop = '12px';
        const candidates = [best, ...(ranked.alternatives || [])].filter(Boolean);
        alt.innerHTML = '<strong>Ranked locators:</strong> ' + candidates.map((a, idx) => {
          const prefix = idx === 0 ? 'BEST' : 'ALT';
          return `${prefix} ${a.type} ${a.value} (${a.match_count ?? 0} matches)`;
        }).join(' | ') || 'None';
        card.appendChild(alt);

        if (data && data.code) {
          const codeblock = makeCodeBlock(data.code);
          card.appendChild(codeblock);
        }

        out.appendChild(card);
      }

      document.getElementById('pick').onclick = async () => {
        const selector = document.getElementById('picksel').value;
        const session = document.getElementById('sessionSelect').value;
        const out = document.getElementById('results');
        const button = document.getElementById('pick');
        out.innerHTML = '';
        if (!selector || !selector.trim()) {
          out.innerHTML = '<div class="muted-box">Enter a selector to inspect.</div>';
          updateResultsSummary(0);
          return;
        }
        setLoadingState(button, true, 'Checking...');
        const loader = document.createElement('div');
        loader.className = 'loader';
        loader.textContent = 'Checking selector';
        out.appendChild(loader);
        try {
          const res = await post('/pick', { selector, session });
          out.innerHTML = '';
          renderLocatorResult(res);
          const ranked = res && res.ranked ? res.ranked : { best: null, alternatives: [] };
          const count = [ranked.chosen_best || ranked.best, ...(ranked.alternatives || [])].filter(Boolean).length;
          updateResultsSummary(count);
        } catch (err) {
          out.innerHTML = '<div class="muted-box">Pick failed: ' + (err && err.message ? err.message : 'unknown error') + '</div>';
          updateResultsSummary(0);
          alert('Pick failed: ' + (err && err.message ? err.message : 'unknown error'));
        } finally {
          setLoadingState(button, false, 'Pick');
        }
      };

      clearFormValues();
      updateResultsSummary(0);
      fetchSessions();

      function toast(msg){
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.position = 'fixed';
        t.style.right = '20px';
        t.style.top = '20px';
        t.style.background = 'rgba(15,23,36,0.9)';
        t.style.color = '#fff';
        t.style.padding = '10px 12px';
        t.style.borderRadius = '10px';
        t.style.zIndex = '100000';
        t.style.fontSize = '0.8rem';
        document.body.appendChild(t);
        setTimeout(() => { t.remove(); }, 1500);
      }

      document.addEventListener('keydown', async (e) => {
        const session = document.getElementById('sessionSelect').value;
        if ((e.ctrlKey || e.metaKey) && (e.key === 'o' || e.key === 'O')) {
          e.preventDefault();
          const url = document.getElementById('url').value;
          if (!url) return toast('Enter URL first');
          await post('/open', { url, session });
          toast('Opened');
        }
        if ((e.ctrlKey || e.metaKey) && (e.key === 'd' || e.key === 'D')) {
          e.preventDefault();
          const desc = document.getElementById('desc').value;
          if (!desc) {
            document.getElementById('desc').focus();
            return;
          }
          const res = await post('/describe', { description: desc, session });
          document.getElementById('results').innerHTML = '';
          if (!res.matches || res.matches.length === 0) {
            document.getElementById('results').innerHTML = '<div class="muted-box">No matches</div>';
            return;
          }
          document.getElementById('describe').click();
          toast('Described');
        }
        if (e.key === 'Escape') {
          e.preventDefault();
          await post('/unhighlight', { session });
          toast('Cleared highlights');
        }
      });
    </script>
  </body>
</html>
